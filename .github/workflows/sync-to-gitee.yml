name: Sync to Gitee

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        run: |
          git remote add gitee "https://oauth2:${{ secrets.GITEE_PASSWORD }}@gitee.com/ginohei/hermes-robots.git"
          git push gitee main:main --force
